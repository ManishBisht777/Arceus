[project]
name = "arceus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manish Bisht", email = "manish@delightree.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "slack-bolt>=1.30.0",
]

[project.scripts]
arceus = "arceus:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
